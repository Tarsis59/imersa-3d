name: imersa3d
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: imersa_owner
      POSTGRES_PASSWORD: imersa_owner_dev
      POSTGRES_DB: imersa
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imersa_owner -d imersa"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
