[project]
name = "imersa-bim"
version = "0.1.0"
description = "Imersa 3D: IFC (BIM) → GLB para a web (Y para cima, nós por GUID, tipo IFC em cada nó) + pavimentos, ambientes e áreas"
requires-python = ">=3.11"
dependencies = ["ifcopenshell>=0.8", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
