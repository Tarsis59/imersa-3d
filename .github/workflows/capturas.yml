# Capturas (fotos/vídeo → 3D), giros 360° fotorrealistas, vídeos de marketing e bake de luz (Blender) na hospedagem grátis: o serviço da API (Render
# grátis) desliga sem visitas e mataria um processamento longo no meio. Aqui roda de hora em hora (ou na hora, pelo
# botão "Run workflow"), processa a fila até esvaziar e termina. O treino e o render rodam na GPU grátis do Kaggle;
# este job só valida, desfoca rostos, comprime e guarda os resultados.
# Liga com a variável do repositório CAPTURAS_ATIVAS=true (Settings → Secrets and variables → Actions).
name: Capturas 3D

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: capturas
  cancel-in-progress: false

jobs:
  fila:
    if: ${{ vars.CAPTURAS_ATIVAS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TOTP_KEY: ${{ secrets.TOTP_KEY }}
      ARMAZENAMENTO: s3
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGIAO: ${{ secrets.S3_REGIAO }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      # token novo do Kaggle (Settings → API Tokens → Generate New Token), lido pelo kaggle >= 1.8
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      RECONSTRUTOR: python
      RECONSTRUCAO_PYTHON: python
      AMBIENTE: producao
    steps:
      # checagem de segundos (psql já vem no runner): sem trabalho na fila, termina sem instalar nada e
      # gasta ~1 min dos 2.000 grátis por mês do repositório privado
      - name: Há captura, giro ou vídeo na fila?
        id: fila
        run: |
          pendente=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc 'SELECT ha_captura_pendente() OR ha_giro_pendente() OR ha_video_pendente() OR ha_bake_pendente()')
          echo "Trabalho na fila: $pendente"
          echo "pendente=$pendente" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.fila.outputs.pendente == 't'
      - uses: pnpm/action-setup@v4
        if: steps.fila.outputs.pendente == 't'
      - uses: actions/setup-node@v4
        if: steps.fila.outputs.pendente == 't'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        if: steps.fila.outputs.pendente == 't'
        with:
          python-version: '3.12'
      - name: Dependências
        if: steps.fila.outputs.pendente == 't'
        run: |
          pnpm install --frozen-lockfile --filter "@imersa/api..."
          pip install "numpy>=2.0" "opencv-python-headless>=4.10" "kaggle>=2.2"
          npm install -g --no-audit --no-fund @playcanvas/splat-transform@3.10.3
      - name: Processar a fila
        if: steps.fila.outputs.pendente == 't'
        run: pnpm --filter @imersa/api exec tsx src/worker.ts --uma-vez
