name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: imersa_owner
          POSTGRES_PASSWORD: imersa_owner_dev
          POSTGRES_DB: imersa
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U imersa_owner -d imersa"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Papéis e bancos de teste
        run: psql -h localhost -p 55432 -U imersa_owner -d imersa -v ON_ERROR_STOP=1 -f infra/docker/initdb/01-roles.sql
        env:
          PGPASSWORD: imersa_owner_dev
      - name: .env de CI com segredos descartáveis
        run: |
          cp .env.example .env
          sed -i "s#^JWT_SECRET=.*#JWT_SECRET=$(openssl rand -base64 48 | tr '+/' '-_' | tr -d '=')#" .env
          sed -i "s#^TOTP_KEY=.*#TOTP_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')#" .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # chromium (computador, celular, tablet Android) e webkit (motor do Safari: iPad)
      - run: pnpm --filter @imersa/web exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - servico: reconstrucao
            deps: '"numpy>=2.0" "opencv-python-headless>=4.10" pytest'
          - servico: bim
            deps: '"ifcopenshell>=0.8" "numpy>=2.0" pytest'
    defaults:
      run:
        working-directory: servicos/${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install ${{ matrix.deps }}
      - run: python -m pytest -q
