# Gera as imagens de referência dos testes visuais no Linux (as do Windows ficam no repositório com sufixo -win32).
# Rodar pelo botão "Run workflow" quando a aparência mudar de propósito; baixar o artefato e versionar as imagens.
name: Referências visuais (Linux)

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: imersa_owner
          POSTGRES_PASSWORD: imersa_owner_dev
          POSTGRES_DB: imersa
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U imersa_owner -d imersa"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Papéis e bancos de teste
        run: psql -h localhost -p 55432 -U imersa_owner -d imersa -v ON_ERROR_STOP=1 -f infra/docker/initdb/01-roles.sql
        env:
          PGPASSWORD: imersa_owner_dev
      - name: .env de CI com segredos descartáveis
        run: |
          cp .env.example .env
          sed -i "s#^JWT_SECRET=.*#JWT_SECRET=$(openssl rand -base64 48 | tr '+/' '-_' | tr -d '=')#" .env
          sed -i "s#^TOTP_KEY=.*#TOTP_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')#" .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @imersa/web exec playwright install --with-deps chromium
      - run: pnpm --filter @imersa/web exec playwright test e2e/visual.spec.ts --project=chromium --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: referencias-visuais-linux
          path: apps/web/e2e/*-snapshots/*-linux.png
